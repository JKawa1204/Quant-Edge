          type: array
          items:
            $ref: "#/components/schemas/TimeSeriesPoint"
        efficientFrontier:
          type: array
          items:
            $ref: "#/components/schemas/FrontierPoint"
        allocationHistory:
          type: array
          items:
            $ref: "#/components/schemas/TimeSeriesPoint"

    TradingAnalytics:
      type: object
      required: [strategies]
      properties:
        strategies:
          type: array
          items:
            $ref: "#/components/schemas/StrategyMetrics"

    StrategyMetrics:
      type: object
      required: [name, totalReturn, winRate, profitFactor, sharpeRatio, maxDrawdown, tradesCount]
      properties:
        name: { type: string }
        totalReturn: { type: number }
        winRate: { type: number }
        profitFactor: { type: number }
        sharpeRatio: { type: number }
        maxDrawdown: { type: number }
        tradesCount: { type: integer }

    CorrelationAnalytics:
      type: object
      required: [symbols, matrix, sectorExposure, diversificationScore]
      properties:
        symbols:
          type: array
          items:
            type: string
        matrix:
          type: array
          items:
            type: array
            items:
              type: number
        sectorExposure:
          type: array
          items:
            $ref: "#/components/schemas/SectorEntry"
        diversificationScore: { type: number }

    SectorEntry:
      type: object
      required: [sector, weight]
      properties:
        sector: { type: string }
        weight: { type: number }

    TimeSeriesPoint:
      type: object
      required: [date, value]
      properties:
        date: { type: string }
        value: { type: number }

    FrontierPoint:
      type: object
      required: [risk, return]
      properties:
        risk: { type: number }
        return: { type: number }

