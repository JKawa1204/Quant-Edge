    PortfolioAnalytics:
      type: object
      required: [returns, volatility, sharpeRatio, sortinoRatio, maxDrawdown, cagr, growthCurve, efficientFrontier, allocationHistory]
      properties:
        returns: { type: number }
        volatility: { type: number }
        sharpeRatio: { type: number }
        sortinoRatio: { type: number }
        maxDrawdown: { type: number }
        cagr: { type: number }
