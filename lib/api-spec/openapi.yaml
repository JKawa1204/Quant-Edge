            $ref: "#/components/schemas/TimeSeriesPoint"

    BacktestMetrics:
      type: object
      required: [totalReturn, cagr, sharpeRatio, sortinoRatio, maxDrawdown, alpha, beta, informationRatio, trackingError, winRate, profitFactor, totalTrades]
      properties:
        totalReturn: { type: number }
        cagr: { type: number }
        sharpeRatio: { type: number }
        sortinoRatio: { type: number }
        maxDrawdown: { type: number }
        alpha: { type: number }
        beta: { type: number }
        informationRatio: { type: number }
        trackingError: { type: number }
        winRate: { type: number }
        profitFactor: { type: number }
        totalTrades: { type: integer }

    MonthlyReturn:
