kind = "web"
previewPath = "/"
title = "QUANTEDGE"
version = "1.0.0"
id = "artifacts/quantedge"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20581

[services.development]
run = "pnpm --filter @workspace/quantedge run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/quantedge", "run", "build" ]
publicDir = "artifacts/quantedge/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20581"
BASE_PATH = "/"
